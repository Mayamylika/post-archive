:root{

    if(act==='ftag'&&r[0]==='年級'&&!hasSubj(selected)) return;
    var b=r[1].map(function(t){return tagBtn(t,selected,act);}).join('');
    if(b) h+='<div class="grp"><span class="grp-name'+(r[1].length?gc(r[1][0]):'')+'">'+esc(r[0])+'</span>'+b+'</div>';
    subs.forEach(function(par){if(r[1].indexOf(par)<0)return;
      if(act==='ftag'){if(subShown(par,selected))h+=subH(par);}
      else{var on=ui.open[par]||subShown(par,selected);var n=Object.keys(SUBOF).filter(function(t){return SUBOF[t]===par&&count(t);}).length;
        h+='<div class="grp"><span class="grp-name"></span><button type="button" class="tag more'+gc(par)+'" data-act="open" data-tag="'+esc(par)+'" aria-expanded="'+!!ui.open[par]+'">'+esc(par)+'細項 '+(ui.open[par]?'▴ 收起':'▾ 展開')+(n?'（'+n+'）':'')+'</button></div>';
        if(ui.open[par])h+=subH(par);}
    });
  });
  return '<div class="groups">'+h+'</div>';
}

function render(){
  var canEdit=editor&&!ui.preview&&!ui.readonly;
  ui.guest=!canEdit;
  var picks=pickList(); var p=picks.length?picks[ui.skip%picks.length]:null;
  var list=filtered();
  var hasEx=canEdit&&state.items.some(function(i){return i.ex;});
  var h='<div class="wrap">';
  h+='<header><h1>甯靜馨室貼文存檔</h1><p class="sub">'+(canEdit?'每天拉一篇好文出來，讓舊文章重新被看見':'老師、家長都能用的教學好文，點關鍵字或搜尋，找到你需要的文章')+'</p><div class="status" id="status" aria-live="polite">'+esc(canEdit?ui.status:'')+'</div></header>';
  if(editor&&ui.preview) h+='<p class="preview"><span>這是訪客看到的畫面：只能瀏覽和搜尋，不能修改。</span><button data-act="preview">回到編輯</button></p>';
  if(p&&canEdit){
    h+='<section class="pick" aria-label="今天推薦分享"><span class="label">今天拉這篇</span>'+
      '<h2><a href="'+esc(safeUrl(p.url))+'" target="_blank" rel="noopener">'+esc(p.title)+'</a></h2>'+
      '<p class="why">'+(p.last?'上次分享：'+esc(p.last)+'，是最久沒拉出來的一篇':'還沒重新分享過')+'</p>'+
      '<div class="row">'+(canEdit?'<button class="primary" data-act="shared" data-id="'+esc(p.id)+'">今天已分享</button>':'')+
      '<button data-act="copy" data-id="'+esc(p.id)+'">複製連結</button><button data-act="skip">換一篇</button></div></section>';
  }
  h+='<section class="tools"><input class="search" id="q" type="search" placeholder="搜尋標題、關鍵字、備註" value="'+esc(ui.q)+'">';
  h+='<div class="tags" role="group" aria-label="種類"><button type="button" class="tag" data-act="all" aria-pressed="'+(!ui.tags.length&&ui.kind==='all')+'">全部 '+visible().length+'</button>'+
    [['post','臉書貼文'],['site','其他網站'],['hidden','未公開']].map(function(k){var n=visible().filter(function(i){return k[0]==='hidden'?!!i.hide:kindOf(i)===k[0];}).length;return n?'<button type="button" class="tag" data-act="kind" data-kind="'+k[0]+'" aria-pressed="'+(ui.kind===k[0])+'">'+k[1]+' '+n+'</button>':'';}).join('')+'</div>'+tagButtons(ui.tags,'tag');
  h+='<div class="match" role="group" aria-label="多選時"><span class="hint">點多個關鍵字時：</span><button type="button" class="tag" data-act="match" data-m="and" aria-pressed="'+(ui.match==='and')+'">全部都要有（交集）</button><button type="button" class="tag" data-act="match" data-m="or" aria-pressed="'+(ui.match==='or')+'">有其中一個就好（聯集）</button>'+(ui.tags.length?'<button type="button" class="tag clear" data-act="all">✕ 清除已選 '+ui.tags.length+' 個</button>':'')+'</div>';
  if(ui.tags.length)h+='<p class="hint">已選：'+esc(hashtags(ui.tags))+'</p>';
  if(canEdit) h+='<div class="row"><button class="primary" data-act="newForm">'+(ui.form&&!ui.form.id?'收起':'＋ 新增')+'</button>'+
     '<button data-act="toggleToc">'+(ui.toc?'收起目錄文':'產生目錄文')+'</button><button data-act="preview">看訪客畫面</button></div>';
  h+='</section>';
  if(ui.form&&canEdit){
    var f=ui.form;
    h+='<form class="add" id="addForm"><strong class="full">'+(f.id?'編輯':'新增貼文或網站')+'</strong>'+
      '<label>種類<select id="f-kind"><option value="post"'+(f.kind!=='site'?' selected':'')+'>臉書貼文</option><option value="site"'+(f.kind==='site'?' selected':'')+'>其他網站</option></select></label>'+
      '<label>給別人看<select id="f-hide"><option value="0"'+(f.hide!=='1'?' selected':'')+'>公開</option><option value="1"'+(f.hide==='1'?' selected':'')+'>未公開（只有我看得到）</option></select></label>'+
      '<label class="full">連結<input id="f-url" type="url" required placeholder="https://www.facebook.com/groups/…" value="'+esc(f.url)+'"></label>'+
      '<label class="full">標題<input id="f-title" required placeholder="例如：分數概念這樣教" value="'+esc(f.title)+'"></label>'+
      '<div class="full" style="display:flex;flex-direction:column;gap:6px"><span class="hint">關鍵字（可複選，建議 3～5 個；綜合教育文章固定同時選 #老師 #家長）</span>'+tagButtons(f.tags,'ftag')+
      (hasSubj(f.tags)?'<span class="hint">有選語文或數學，可以再點年級（可複選）</span>':'')+'<span class="hint'+(f.tags.length&&(f.tags.length<3||f.tags.length>5)?' warn':'')+'">已選 '+f.tags.length+' 個'+(f.tags.length?'：'+esc(hashtags(f.tags)):'')+'</span>'+
      '<div class="addtag"><input id="f-newtag" placeholder="詞庫沒有的才自己輸入，例如：中秋" value="'+esc(f.newtag)+'"><button type="button" data-act="addtag">加入</button></div></div>'+
      '<label>日期<input id="f-posted" type="date" value="'+esc(f.posted)+'"></label>'+
      '<label>備註（可空白）<input id="f-note" placeholder="例如：每年九月拉出來" value="'+esc(f.note)+'"></label>'+
      '<div class="full row"><button class="primary" type="submit">'+(f.id?'儲存修改':'存進去')+'</button><button type="button" data-act="cancel">取消</button></div></form>';
  }
  if(ui.toc&&canEdit){
    h+='<section class="toc"><strong>目錄文（可直接貼到臉書）</strong><textarea id="tocArea" readonly>'+esc(tocText())+'</textarea><div class="row"><button class="primary" data-act="copyToc">複製全文</button></div></section>';
  }
  if(hasEx) h+='<p class="banner">標著「範例」的是示範用，加入你自己的貼文後可以刪掉。</p>';
  h+='<div class="count">'+list.length+' 篇</div><div class="list">';
  if(!list.length) h+='<div class="empty">'+(state.items.length?'找不到符合的貼文':'還沒有貼文，按「新增貼文」把第一篇存進來')+'</div>';
  list.forEach(function(it){
    h+='<article class="item'+(it.hide?' is-hid':'')+'"><a class="t" href="'+esc(safeUrl(it.url))+'" target="_blank" rel="noopener">'+esc(it.title)+'</a>'+
      '<div class="meta">'+it.tags.map(function(t){return '<button type="button" class="chip'+gc(t)+'" data-act="only" data-tag="'+esc(t)+'">'+esc(t)+'</button>';}).join('')+
      (kindOf(it)==='site'?'<span class="kind">網站</span>':'')+(it.ex?'<span class="ex">範例</span>':'')+(it.hide&&canEdit?'<span class="kind hid">未公開</span>':'')+
      '<span>'+esc(it.posted||'')+'</span>'+(canEdit&&kindOf(it)==='post'?'<span>上次分享 '+esc(it.last||'還沒')+'</span>':'')+'</div>'+
      (it.note?'<p class="note">'+esc(it.note)+'</p>':'')+
      '<div class="acts"><button data-act="copy" data-id="'+esc(it.id)+'">複製連結</button>'+
      (canEdit?'<button data-act="copyTags" data-id="'+esc(it.id)+'">複製標籤</button>'+(kindOf(it)==='post'?'<button data-act="shared" data-id="'+esc(it.id)+'">今天已分享</button>':'')+'<button data-act="hide" data-id="'+esc(it.id)+'">'+(it.hide?'改成公開':'設為未公開')+'</button><button data-act="edit" data-id="'+esc(it.id)+'">編輯</button><button class="del'+(ui.confirm===it.id?' sure':'')+'" data-act="del" data-id="'+esc(it.id)+'">'+(ui.confirm===it.id?'確定刪除？':'刪除')+'</button>':'')+
      '</div></article>';
  });
  h+='</div></div>';
  var ae=document.activeElement, fid=ae&&ae.id, pos=null;
  try{pos=ae&&ae.selectionStart;}catch(e){}
  app.innerHTML=h;
  if(fid&&/^(q|f-)/.test(fid)){var el=document.getElementById(fid);if(el){el.focus();try{if(pos!=null)el.setSelectionRange(pos,pos);}catch(e){}}}
}

function find(id){for(var i=0;i<state.items.length;i++)if(state.items[i].id===id)return state.items[i];}
function copy(text,btn){
  var done=function(){var o=btn.textContent;btn.textContent='已複製';setTimeout(function(){btn.textContent=o;},1200);};
  try{navigator.clipboard.writeText(text).then(done,function(){fallback();});}catch(e){fallback();}
  function fallback(){var ta=document.getElementById('tocArea');if(ta&&text===ta.value){ta.focus();ta.select();}btn.textContent='請長按選取複製';}
}
function toggle(arr,t){var i=arr.indexOf(t);if(i>=0)arr.splice(i,1);else arr.push(t);}
function addNewTag(){
  if(!ui.form) return;
  splitTags(ui.form.newtag).forEach(function(t){t=ALIAS[t]||t;if(ui.form.tags.indexOf(t)<0)ui.form.tags.push(t);});
  ui.form.newtag='';
}
function blankForm(){return {id:null,kind:'post',url:'',title:'',tags:BOTH.slice(),newtag:'',posted:today(),note:'',hide:'0'};}

app.addEventListener('click',function(e){
  var b=e.target.closest('[data-act]'); if(!b) return;
  var a=b.dataset.act, id=b.dataset.id, t=b.dataset.tag;
  if(a==='all'){ui.tags=[];ui.kind='all';render();}
  else if(a==='kind'){ui.kind=(ui.kind===b.dataset.kind)?'all':b.dataset.kind;render();}
  else if(a==='preview'){ui.preview=!ui.preview;ui.form=null;ui.toc=false;render();window.scrollTo(0,0);}
  else if(a==='tag'){toggle(ui.tags,t);render();}
  else if(a==='match'){ui.match=b.dataset.m;render();}
  else if(a==='open'){ui.open[t]=!ui.open[t];render();}
  else if(a==='only'){ui.tags=[t];render();window.scrollTo(0,0);}
  else if(a==='ftag'){toggle(ui.form.tags,t);if(SUBOF[t]&&ui.form.tags.indexOf(t)>=0)ui.form.tags=normTags(ui.form.tags);render();}
  else if(a==='addtag'){addNewTag();render();var n=document.getElementById('f-newtag');if(n)n.focus();}
  else if(a==='skip'){ui.skip++;render();}
  else if(a==='newForm'){ui.form=(ui.form&&!ui.form.id)?null:blankForm();render();if(ui.form)document.getElementById('f-url').focus();}
  else if(a==='edit'){var ei=find(id);if(ei){ui.form={id:ei.id,kind:kindOf(ei),url:ei.url,title:ei.title,tags:ei.tags.slice(),newtag:'',posted:ei.posted,note:ei.note||'',hide:ei.hide?'1':'0'};render();window.scrollTo(0,0);}}
  else if(a==='cancel'){ui.form=null;render();}
  else if(a==='toggleToc'){ui.toc=!ui.toc;render();}
  else if(a==='hide'){var ih=find(id);if(ih){ih.hide=!ih.hide;render();save();}}
  else if(a==='copyToc'){copy(tocText(),b);}
  else if(a==='copy'){var it=find(id);if(it)copy(it.url,b);}
  else if(a==='copyTags'){var it3=find(id);if(it3)copy(hashtags(it3.tags),b);}
  else if(a==='shared'){var it2=find(id);if(it2){it2.last=today();ui.skip=0;render();save();}}
  else if(a==='del'){
    if(ui.confirm===id){state.items=state.items.filter(function(i){return i.id!==id;});ui.confirm=null;render();save();}
    else{ui.confirm=id;render();setTimeout(function(){if(ui.confirm===id){ui.confirm=null;render();}},3000);}
  }
});
var FIELDS={'f-hide':'hide','f-kind':'kind','f-url':'url','f-title':'title','f-newtag':'newtag','f-posted':'posted','f-note':'note'};
app.addEventListener('input',function(e){
  if(e.target.id==='q'){ui.q=e.target.value;render();}
  else if(ui.form&&FIELDS[e.target.id]){ui.form[FIELDS[e.target.id]]=e.target.value;}
});
app.addEventListener('keydown',function(e){
  if(e.target.id==='f-newtag'&&e.key==='Enter'&&!e.isComposing){e.preventDefault();addNewTag();render();}
});
app.addEventListener('submit',function(e){
  if(e.target.id!=='addForm') return; e.preventDefault();
  addNewTag();
  var f=ui.form;
  var ftags=hasSubj(f.tags)?f.tags:f.tags.filter(function(t){return GRADES.indexOf(t)<0;});
  var rec={kind:f.kind==='site'?'site':'post',title:f.title.trim(),url:f.url.trim(),tags:normTags(ftags),posted:f.posted,note:f.note.trim(),hide:f.hide==='1'};
  if(f.id){var it=find(f.id);if(it){for(var k in rec)it[k]=rec[k];it.ex=false;}}
  else{rec.id='p'+Date.now().toString(36);rec.last='';rec.ex=false;state.items.push(rec);}
  ui.form=null;ui.q='';render();save();
});

render();
var cu=window.claude&&window.claude.use;
Promise.all([cu?cu('artifact'):null,cu?cu('user'):null]).then(function(r){
  art=r[0];var u=r[1];
  return (art&&u)?u.canEdit():false;
}).then(function(ok){editor=!!ok;mode=editor?'art':'view';render();},function(){editor=false;mode='view';render();});
})();
</script>

</body></html>
